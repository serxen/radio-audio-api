<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>📻 Smart Radio App 😊</title>
</head>
<body>
    <div class="radio-container"></div>
    <div class="radio-card text-center"></div>
        <select id="countrySelect" class="form-select mt-3"></select>
        <select id="stationSelect" class="form-select mt-3"></select>

        <div class="mt-3">
            <img src="https://pnglove.com/detail?n=s3Z2" alt="" id="stationLogo" class="logo">
        </div>

        <div class="fw-bold mt-2" id="stationName">Select Station</div>
        <div class="small-info" id="stationInfo"></div>

        
    <script src="script.js"></script>
</body>
</html>
